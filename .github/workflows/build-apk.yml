name: Build FFPanel APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Install NDK and CMake
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;26.3.11579264" \
            "cmake;3.22.1" \
            "build-tools;34.0.0" \
            "platforms;android-34"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Clone Dobby
        run: git clone https://github.com/jmpews/Dobby.git /tmp/Dobby

      - name: Patch Dobby
        run: |
          DOBBY=/tmp/Dobby

          # Fix 1: @PAGE/@PAGEOFF → Linux :lo12: in arm64 asm files
          for f in \
            "$DOBBY/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm" \
            "$DOBBY/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_trampoline_arm64.asm"; do
            if [ -f "$f" ]; then
              sed -i 's/adrp \(x[0-9]*\), \([a-zA-Z_]*\)@PAGE/adrp \1, \2/g' "$f"
              sed -i 's/add \(x[0-9]*\), \(x[0-9]*\), \([a-zA-Z_]*\)@PAGEOFF/add \1, \2, :lo12:\3/g' "$f"
              echo "ASM patched: $f"
            fi
          done

          # Fix 2: OSMemory undefined — inject forward declaration directly into os_arch_features.h
          ARCH_H="$DOBBY/common/os_arch_features.h"
          if [ -f "$ARCH_H" ]; then
            # Check if OSMemory class is already declared
            if ! grep -q "class OSMemory" "$ARCH_H"; then
              # Find where ProcessRuntimeUtility.h actually lives
              PUTIL=$(find $DOBBY -name "ProcessRuntimeUtility.h" | head -1)
              echo "Found ProcessRuntimeUtility at: $PUTIL"
              if [ -n "$PUTIL" ]; then
                # Get path relative to DOBBY root
                REL=$(realpath --relative-to="$DOBBY" "$PUTIL")
                echo "Relative path: $REL"
                # Prepend correct relative include
                sed -i "1s|^|#include \"$REL\"\n|" "$ARCH_H"
                echo "OSMemory patched with real relative path"
              else
                echo "ProcessRuntimeUtility.h not found in Dobby"
              fi
            fi
          fi

          # Same fix for platform-posix.cc
          POSIX="$DOBBY/source/Backend/UserMode/UnifiedInterface/platform-posix.cc"
          if [ -f "$POSIX" ]; then
            if ! grep -q "ProcessRuntimeUtility.h" "$POSIX"; then
              PUTIL=$(find $DOBBY -name "ProcessRuntimeUtility.h" | head -1)
              if [ -n "$PUTIL" ]; then
                REL=$(realpath --relative-to="$(dirname $POSIX)" "$PUTIL")
                sed -i "1s|^|#include \"$REL\"\n|" "$POSIX"
                echo "platform-posix.cc patched"
              fi
            fi
          fi

          echo "All patches applied."

      - name: Build Dobby arm64-v8a
        run: |
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_DEBUG=OFF \
            -DPlugin.Android.BionicLinkerUtil=OFF \
            -B /tmp/Dobby/build_arm64 \
            /tmp/Dobby
          cmake --build /tmp/Dobby/build_arm64 -- -j$(nproc)
          mkdir -p jni/dobby/lib/arm64-v8a
          cp /tmp/Dobby/build_arm64/libdobby.a jni/dobby/lib/arm64-v8a/libdobby.a
          echo "arm64 done"

      - name: Build Dobby armeabi-v7a
        run: |
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_DEBUG=OFF \
            -DPlugin.Android.BionicLinkerUtil=OFF \
            -B /tmp/Dobby/build_arm32 \
            /tmp/Dobby
          cmake --build /tmp/Dobby/build_arm32 -- -j$(nproc)
          mkdir -p jni/dobby/lib/armeabi-v7a
          cp /tmp/Dobby/build_arm32/libdobby.a jni/dobby/lib/armeabi-v7a/libdobby.a
          echo "armeabi-v7a done"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FFPanel-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release*.apk
          retention-days: 30
