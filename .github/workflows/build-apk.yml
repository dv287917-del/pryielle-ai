name: Build FFPanel APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Install NDK and CMake
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;26.3.11579264" \
            "cmake;3.22.1" \
            "build-tools;34.0.0" \
            "platforms;android-34"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Clone and Patch Dobby
        run: |
          git clone https://github.com/jmpews/Dobby.git /tmp/Dobby

          # Write patch script to a real file (no heredoc indent issues)
          cat > /tmp/patch_dobby.py << 'PYEOF'
import re, os

# Fix 1: @PAGE/@PAGEOFF → Linux :lo12: syntax
asm_files = [
    "/tmp/Dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm",
    "/tmp/Dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_trampoline_arm64.asm",
]
for path in asm_files:
    if not os.path.exists(path):
        print(f"SKIP (not found): {path}")
        continue
    with open(path, 'r') as f:
        content = f.read()
    content = re.sub(r'adrp\s+(\w+),\s+(\w+)@PAGE', r'adrp \1, \2', content)
    content = re.sub(r'add\s+(\w+),\s+(\w+),\s+(\w+)@PAGEOFF', r'add \1, \2, :lo12:\3', content)
    with open(path, 'w') as f:
        f.write(content)
    print(f"PATCHED: {path}")

# Fix 2: OSMemory undeclared — add missing include in platform-posix.cc
posix_file = "/tmp/Dobby/source/Backend/UserMode/UnifiedInterface/platform-posix.cc"
if os.path.exists(posix_file):
    with open(posix_file, 'r') as f:
        content = f.read()
    fix = '#include "source/Backend/UserMode/PlatformUtil/ProcessRuntimeUtility.h"\n'
    if fix not in content:
        content = fix + content
        with open(posix_file, 'w') as f:
            f.write(content)
        print(f"PATCHED: {posix_file}")
    else:
        print(f"ALREADY PATCHED: {posix_file}")

# Fix 3: os_arch_features.h — add OSMemory forward ref if missing
arch_file = "/tmp/Dobby/common/os_arch_features.h"
if os.path.exists(arch_file):
    with open(arch_file, 'r') as f:
        content = f.read()
    fix = '#include "source/Backend/UserMode/PlatformUtil/ProcessRuntimeUtility.h"\n'
    if fix not in content:
        content = fix + content
        with open(arch_file, 'w') as f:
            f.write(content)
        print(f"PATCHED: {arch_file}")

print("All patches done.")
PYEOF
          python3 /tmp/patch_dobby.py

      - name: Build Dobby for arm64-v8a
        run: |
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_DEBUG=OFF \
            -DPlugin.Android.BionicLinkerUtil=OFF \
            -B /tmp/Dobby/build_arm64 \
            /tmp/Dobby
          cmake --build /tmp/Dobby/build_arm64 -- -j$(nproc)
          mkdir -p jni/dobby/lib/arm64-v8a
          cp /tmp/Dobby/build_arm64/libdobby.a jni/dobby/lib/arm64-v8a/libdobby.a
          echo "✅ arm64-v8a done"

      - name: Build Dobby for armeabi-v7a
        run: |
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_DEBUG=OFF \
            -DPlugin.Android.BionicLinkerUtil=OFF \
            -B /tmp/Dobby/build_arm32 \
            /tmp/Dobby
          cmake --build /tmp/Dobby/build_arm32 -- -j$(nproc)
          mkdir -p jni/dobby/lib/armeabi-v7a
          cp /tmp/Dobby/build_arm32/libdobby.a jni/dobby/lib/armeabi-v7a/libdobby.a
          echo "✅ armeabi-v7a done"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FFPanel-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release*.apk
          retention-days: 30
