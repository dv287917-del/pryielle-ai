name: Build FFPanel APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Install NDK and CMake
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;26.3.11579264" \
            "cmake;3.22.1" \
            "build-tools;34.0.0" \
            "platforms;android-34"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Clone Dobby
        run: git clone https://github.com/jmpews/Dobby.git /tmp/Dobby

      - name: Patch Dobby ASM and OSMemory
        run: |
          python3 -c "
          import re, os

          asm_files = [
              '/tmp/Dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm',
              '/tmp/Dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_trampoline_arm64.asm',
          ]
          for path in asm_files:
              if not os.path.exists(path):
                  print('SKIP:', path)
                  continue
              with open(path) as f:
                  c = f.read()
              c = re.sub(r'adrp\s+(\w+),\s+(\w+)@PAGE', r'adrp \1, \2', c)
              c = re.sub(r'add\s+(\w+),\s+(\w+),\s+(\w+)@PAGEOFF', r'add \1, \2, :lo12:\3', c)
              with open(path, 'w') as f:
                  f.write(c)
              print('ASM PATCHED:', path)

          for path in [
              '/tmp/Dobby/source/Backend/UserMode/UnifiedInterface/platform-posix.cc',
              '/tmp/Dobby/common/os_arch_features.h',
          ]:
              if not os.path.exists(path):
                  print('SKIP:', path)
                  continue
              with open(path) as f:
                  c = f.read()
              inc = '#include \"source/Backend/UserMode/PlatformUtil/ProcessRuntimeUtility.h\"\n'
              if inc not in c:
                  c = inc + c
                  with open(path, 'w') as f:
                      f.write(c)
                  print('OSMEMORY PATCHED:', path)
              else:
                  print('ALREADY PATCHED:', path)
          print('All patches done.')
          "

      - name: Build Dobby arm64-v8a
        run: |
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_DEBUG=OFF \
            -DPlugin.Android.BionicLinkerUtil=OFF \
            -B /tmp/Dobby/build_arm64 \
            /tmp/Dobby
          cmake --build /tmp/Dobby/build_arm64 -- -j$(nproc)
          mkdir -p jni/dobby/lib/arm64-v8a
          cp /tmp/Dobby/build_arm64/libdobby.a jni/dobby/lib/arm64-v8a/libdobby.a
          echo "arm64 done"

      - name: Build Dobby armeabi-v7a
        run: |
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_DEBUG=OFF \
            -DPlugin.Android.BionicLinkerUtil=OFF \
            -B /tmp/Dobby/build_arm32 \
            /tmp/Dobby
          cmake --build /tmp/Dobby/build_arm32 -- -j$(nproc)
          mkdir -p jni/dobby/lib/armeabi-v7a
          cp /tmp/Dobby/build_arm32/libdobby.a jni/dobby/lib/armeabi-v7a/libdobby.a
          echo "armeabi-v7a done"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FFPanel-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release*.apk
          retention-days: 30
