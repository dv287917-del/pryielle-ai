name: Build FF Glory Bot APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auto-unzip and setup
        shell: bash
        run: |
          set -euo pipefail

          Z="$(ls -t ./*.zip 2>/dev/null | head -n1 || true)"
          if [ -n "$Z" ]; then
            echo "Zip mili: $Z"
            rm -rf /tmp/unz && mkdir /tmp/unz
            unzip -q "$Z" -d /tmp/unz

            PUBSPEC="$(find /tmp/unz -name pubspec.yaml -not -path '*/.git/*' | head -n1 || true)"
            if [ -z "$PUBSPEC" ]; then
              echo "::error::pubspec.yaml zip ke andar nahi mila"
              find /tmp/unz -type f | head -30
              exit 1
            fi
            FLUTTER_SRC="$(cd "$(dirname "$PUBSPEC")" && pwd)"
            echo "Flutter project: $FLUTTER_SRC"

            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
            cp -a "$FLUTTER_SRC"/. .

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto-unzip flutter project" || true
            git push origin "HEAD:${{ github.ref_name }}" || true
          else
            echo "Zip nahi mili, repo ki files use hongi"
          fi

      - name: Verify pubspec exists
        shell: bash
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "::error::pubspec.yaml root pe nahi hai"
            ls -la
            exit 1
          fi
          echo "pubspec.yaml mila ✓"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate Android folder if missing
        run: |
          if [ ! -d android ]; then
            echo "android/ folder nahi hai, generate kar rahe hain..."
            flutter create --platforms=android --project-name ff_glory_bot .
            echo "android/ generated ✓"
          else
            echo "android/ already exists ✓"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ff-glory-bot-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
