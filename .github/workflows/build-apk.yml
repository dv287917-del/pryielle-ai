name: Build FF Glory Bot APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auto-unzip project zip
        shell: bash
        run: |
          set -euo pipefail
          Z="$(ls -t ./*.zip 2>/dev/null | head -n1 || true)"
          if [ -z "$Z" ]; then
            echo "Zip nahi mili — repo ki files use hongi"
            exit 0
          fi
          echo "Zip mili: $Z"
          rm -rf /tmp/unz && mkdir /tmp/unz
          unzip -q "$Z" -d /tmp/unz

          # flutter-app folder dhundho
          SRC="$(find /tmp/unz -maxdepth 4 -name pubspec.yaml | head -n1 | xargs dirname || true)"
          if [ -z "$SRC" ]; then
            echo "::error::pubspec.yaml nahi mila zip ke andar"
            exit 1
          fi
          echo "Flutter project mila: $SRC"

          # files copy karo root pe
          rm -rf /tmp/old && mkdir /tmp/old
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec mv {} /tmp/old/ \;
          cp -a "$SRC"/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-unzip flutter project" || true
          git push origin "HEAD:${{ github.ref_name }}" || echo "Push skip"

      - name: Locate flutter project
        shell: bash
        run: |
          if [ -f pubspec.yaml ]; then
            echo "FLUTTER_DIR=." >> $GITHUB_ENV
          elif [ -f flutter-app/pubspec.yaml ]; then
            echo "FLUTTER_DIR=flutter-app" >> $GITHUB_ENV
          else
            P="$(find . -maxdepth 4 -name pubspec.yaml ! -path '*/.git/*' | head -n1 | xargs dirname || true)"
            if [ -z "$P" ]; then echo "::error::pubspec.yaml nahi mila"; exit 1; fi
            echo "FLUTTER_DIR=$P" >> $GITHUB_ENV
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: stable

      - name: Flutter pub get
        run: |
          cd ${{ env.FLUTTER_DIR }}
          flutter pub get

      - name: Build APK
        run: |
          cd ${{ env.FLUTTER_DIR }}
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ff-glory-bot-apk
          path: ${{ env.FLUTTER_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
